<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        width: 100vw;
        height: 100vh;
    }
    .center{
        width: 100%;
        height: 100vh;
        background-color: pink;
    }
    .left{
        width: 200px;
        height: 100vh;
        background-color: red;
        margin-left: -100%;
    }
    .right{
        width: 200px;
        height: 100vh;
        background-color: blue;
        margin-left: -200px;
    }
    .container div{
        float: left;
    }
    .main{
        padding: 0 200px;
    }
</style>
<body>
    <div class="container">
        <div class="center">
            <div class="main">中</div>
        </div>
        <div class="left">左</div>
        <div class="right">右</div>
    </div>
</body>
</html>
