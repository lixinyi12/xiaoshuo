<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息修改</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .profile-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            overflow: hidden;
            border: 1px solid #eee;
        }
        
        .profile-header {
            background: #fcc41b;
            color: #333;
            padding: 30px;
            text-align: center;
        }
        
        .profile-header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .profile-header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .profile-content {
            padding: 40px;
        }
        
        .avatar-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .avatar:hover {
            border-color: #fcc41b;
            transform: scale(1.05);
        }
        
        .avatar-upload {
            display: none;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }
        
        input, select, textarea {
            resize: none;
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #fcc41b;
            background: white;
            box-shadow: 0 0 0 3px rgba(252, 196, 27, 0.1);
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .radio-option input {
            width: auto;
        }
        
        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .btn-primary {
            background: #fcc41b;
            color: #333;
        }
        
        .btn-primary:hover {
            background: #e6b016;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 196, 27, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .profile-content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <h1>个人信息修改</h1>
            <p>更新并完善您的个人资料信息</p>
        </div>
        
        <div class="profile-content">
            <div class="avatar-section">
                <img src="https://via.placeholder.com/120" alt="用户头像" class="avatar" id="avatarImage">
                <input type="file" id="avatarUpload" class="avatar-upload" accept="image/*">
                <p style="margin-top: 10px; color: #666; font-size: 0.9em;">点击头像上传新照片</p>
            </div>
            
            <form id="profileForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">姓名 *</label>
                        <input type="text" id="name" name="name" required value="张三">
                    </div>
                    
                    <div class="form-group">
                        <label for="username">用户名 *</label>
                        <input type="text" id="username" name="username" required value="zhangsan" readonly style="background: #f5f5f5;">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">电子邮箱 *</label>
                        <input type="email" id="email" name="email" required value="zhangsan@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">手机号码</label>
                        <input type="tel" id="phone" name="phone" value="13800138000">
                    </div>
                    
                    <div class="form-group">
                        <label>性别</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="gender" value="male" checked> 男
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="gender" value="female"> 女
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="gender" value="other"> 其他
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="birthday">出生日期</label>
                        <input type="date" id="birthday" name="birthday" value="1990-01-01">
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="bio">个人简介</label>
                        <textarea id="bio" name="bio" rows="4" placeholder="介绍一下你自己...">热爱编程和新技术的前端开发者</textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary">取消</button>
                        <button type="submit" class="btn btn-primary">保存更改</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 头像上传功能
        document.getElementById('avatarImage').addEventListener('click', function() {
            document.getElementById('avatarUpload').click();
        });
        
        document.getElementById('avatarUpload').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarImage').src = e.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });
        
        // 表单提交处理
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 这里可以添加表单验证和提交逻辑
            const formData = new FormData(this);
            
            // 模拟提交成功
            alert('个人信息更新成功！');
            // 实际应用中这里应该是AJAX提交到服务器
        });
    </script>
</body>
</html>
